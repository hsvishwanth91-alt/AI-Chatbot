services:
  - type: web
    name: ai-chatbot
    runtime: python
    rootDir: AI-Chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web:app
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TEMPERATURE
        value: "0.7"
      - key: OPENAI_MAX_TOKENS
        value: "512"
      - key: FLASK_SECRET_KEY
        generateValue: true
