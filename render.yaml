services:
  - type: web
    name: ai-chatbot
    runtime: python
    buildCommand: pip install -r AI-Chatbot/requirements.txt
    startCommand: gunicorn --chdir AI-Chatbot web:app
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TEMPERATURE
        value: "0.7"
      - key: OPENAI_MAX_TOKENS
        value: "512"
      - key: FLASK_SECRET_KEY
        generateValue: true
